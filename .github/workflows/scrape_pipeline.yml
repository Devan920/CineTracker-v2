name: Indian Box Office Scrape & Sync Pipeline

on:
  schedule:
    # Run every hour on the hour (UTC)
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run pipeline without writing to Supabase"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      source:
        description: "Target scraper source"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "sacnilk"
          - "koimoi"
          - "x"
      lang:
        description: "Language category filter"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "malayalam"
          - "tamil"
          - "hindi"
          - "telugu"
          - "kannada"
          - "pan-india"

concurrency:
  group: scrape-pipeline-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scraper/requirements.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scraper/requirements.txt') }}

      - name: Install Playwright Chromium & system dependencies
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Restore TMDB local JSON cache
        uses: actions/cache@v4
        with:
          path: scraper/cache/tmdb_cache.json
          key: tmdb-cache-${{ github.run_id }}
          restore-keys: |
            tmdb-cache-

      - name: Execute Box Office Scrape & Sync Engine
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          X_NITTER_INSTANCES: ${{ vars.X_NITTER_INSTANCES }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.source }}" ]; then
            ARGS="$ARGS --source ${{ inputs.source }}"
          fi
          if [ -n "${{ inputs.lang }}" ]; then
            ARGS="$ARGS --lang ${{ inputs.lang }}"
          fi
          python main.py $ARGS

      - name: Upload run report artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: box-office-failure-report-${{ github.run_id }}
          path: |
            scraper/logs/last_run_report.json
            scraper/logs/scraper.log
          retention-days: 14
          if-no-files-found: warn
